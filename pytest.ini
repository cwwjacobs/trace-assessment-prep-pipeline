[pytest]
testpaths = tests
# Paths must stay repository-relative. Absolute operator-machine entries
# (previously /home/abcd/Downloads/gt-mint/*) made the suite pass only on one
# machine. Cross-tier packages are resolved by installing them, not by pythonpath.
# goldtrace_hallmark and goldtrace_vault were promoted to src/ so packages.find
# ships them; a gate that cannot be installed gets impersonated by a script.
pythonpath =
  src

# Registered when goldtrace_vault's tests moved in from donor_components,
# which carried its own pytest config.
markers =
  unit: fast in-process test with no external dependencies
  fixture_e2e: end-to-end exercise over a fixture product lot
